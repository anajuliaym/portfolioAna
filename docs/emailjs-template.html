<!-- EmailJS template for the contact letter (src/api.ts). Paste everything below into
     EmailJS → Email Templates → (template) → Content → "Edit Content" → Code editor.
     Variables sent by the site: {{from_name}} {{reply_to}} {{message}} {{date}} {{lang}} -->
<div style="margin:0;padding:32px 12px;background:#0c0d12;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;margin:0 auto;border-collapse:collapse;">
    <tr>
      <td style="padding:0 4px 14px 4px;font-family:Georgia,'Times New Roman',serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#a6c69a;">
        Uma carta pelo portfólio
      </td>
    </tr>
    <tr>
      <td style="background:#f7f1e6;border-radius:4px;padding:36px 36px 30px 44px;border-left:1px solid #f2c4d0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
          <tr>
            <td style="font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#9a6a7c;padding-bottom:4px;">para</td>
            <td align="right" style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:14px;color:#6b5a6e;padding-bottom:4px;">São Paulo, {{date}}</td>
          </tr>
          <tr>
            <td colspan="2" style="font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.1;color:#1b1620;padding-bottom:22px;border-bottom:1px solid #d9cfc0;">Ana Julia</td>
          </tr>
          <tr>
            <td colspan="2" style="padding-top:18px;font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#9a6a7c;">de</td>
          </tr>
          <tr>
            <td colspan="2" style="font-family:Georgia,'Times New Roman',serif;font-size:20px;color:#2a2440;padding:4px 0 2px;">{{from_name}}</td>
          </tr>
          <tr>
            <td colspan="2" style="padding-bottom:20px;border-bottom:1px solid #d9cfc0;">
              <a href="mailto:{{reply_to}}" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#3f6b6a;text-decoration:none;">{{reply_to}}</a>
            </td>
          </tr>
          <tr>
            <td colspan="2" style="padding:24px 0 8px;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.7;color:#1b1620;white-space:pre-wrap;">{{message}}</td>
          </tr>
          <tr>
            <td colspan="2" style="padding-top:10px;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:18px;color:#2a2440;">— {{from_name}}</td>
          </tr>
          <tr>
            <td colspan="2" style="padding-top:28px;">
              <a href="mailto:{{reply_to}}" style="display:inline-block;background:#9bb994;color:#1f3331;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;text-decoration:none;padding:12px 22px;border-radius:999px;">Responder</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:14px 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;color:#6f6a7c;">
        Enviada pelo formulário de contato do seu portfólio · idioma da página: {{lang}}
      </td>
    </tr>
  </table>
</div>
