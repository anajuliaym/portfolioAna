<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orçamentária</title>
  <!-- Clickable prototype of Ana's Orçamentária screens (scripts/orcamentaria-demo/build.sh). Static: no data, no requests. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
  <style>
    html, body { margin: 0; background: #232323; color: #f2f2f2; font-family: Inter, system-ui, sans-serif; }
    .screen { position: relative; width: 100%; max-width: 1650px; margin: 0 auto; }
    .screen img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    .hot { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 10px; transition: background .2s, box-shadow .2s; }
    .hot:hover, .hot:focus-visible { background: rgba(255, 122, 48, .12); box-shadow: 0 0 0 2px rgba(255, 122, 48, .55); outline: none; }
    body.hint .hot { animation: hint 1.6s ease-in-out 2; }
    @keyframes hint { 50% { background: rgba(255, 122, 48, .18); box-shadow: 0 0 0 2px rgba(255, 122, 48, .7); } }
    @media (prefers-reduced-motion: reduce) { body.hint .hot { animation: none; } }
    .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(20, 20, 20, .92); border: 1px solid rgba(255, 255, 255, .12); padding: 9px 16px; border-radius: 999px; font-size: 13px; white-space: nowrap; transition: opacity .6s; pointer-events: none; }
  </style>
</head>
<body class="hint">
  <main class="screen" id="screen"><img id="shot" alt="" /></main>
  <p class="toast" id="toast">Navegue pelo menu, pelas abas e pelos botões</p>
  <script>
    // Hotspots in the screens' own coordinates (1100 px wide pages). [x1, y1, x2, y2, target, label]
    const NAV = [[505, 36, 612, 76, 1, 'Dashboards'], [616, 36, 731, 76, 2, 'Novo Projeto'], [732, 36, 836, 76, 3, 'Orçamento'], [838, 36, 932, 76, 8, 'Relatórios']]
    const tabs = (y1, y2, xs) => xs.map(([a, b], i) => [a, y1, b, y2, 4 + i, ['Quantitativos', 'Base de Preços', 'Orçamento', 'Simulação'][i]])
    const TABS = tabs(225, 266, [[36, 156], [158, 282], [284, 390], [392, 492]])
    const SCREENS = {
      1: { h: 870, title: 'Dashboards', hot: [[890, 296, 1050, 342, 2, 'Novo Projeto'], [934, 400, 1006, 830, 4, 'Abrir projeto']] },
      2: { h: 870, title: 'Novo Projeto', hot: [[52, 575, 428, 617, 3, 'Salvar Projeto'], [434, 575, 524, 617, 1, 'Cancelar']] },
      3: { h: 675, title: 'Orçamento', hot: [[890, 158, 1050, 204, 2, 'Novo Projeto'], [934, 262, 1006, 636, 4, 'Abrir projeto']] },
      4: { h: 663, title: 'Quantitativos', hot: tabs(213, 256, [[36, 156], [158, 282], [284, 390], [392, 492]]) },
      5: { h: 663, title: 'Base de Preços', hot: TABS },
      6: { h: 957, title: 'Orçamento', hot: TABS },
      7: { h: 785, title: 'Simulação', hot: tabs(223, 266, [[22, 138], [142, 268], [270, 372], [374, 478]]) },
      8: { h: 922, title: 'Relatórios', hot: [] },
    }
    const screen = document.getElementById('screen'), shot = document.getElementById('shot')
    // preload so switching is instant
    Object.keys(SCREENS).forEach((n) => { const i = new Image(); i.src = `screens/p${n}.jpg` })
    function show(n) {
      const s = SCREENS[n]
      shot.src = `screens/p${n}.jpg`; shot.alt = `Orçamentária · ${s.title}`
      screen.querySelectorAll('.hot').forEach((h) => h.remove())
      for (const [x1, y1, x2, y2, to, label] of NAV.concat(s.hot)) {
        const b = document.createElement('button')
        b.className = 'hot'; b.type = 'button'; b.setAttribute('aria-label', label)
        Object.assign(b.style, { left: `${x1 / 11}%`, top: `${y1 / s.h * 100}%`, width: `${(x2 - x1) / 11}%`, height: `${(y2 - y1) / s.h * 100}%` })
        b.addEventListener('click', () => { document.body.classList.remove('hint'); show(to); window.scrollTo(0, 0) })
        screen.appendChild(b)
      }
    }
    show(1)
    setTimeout(() => { document.getElementById('toast').style.opacity = '0' }, 4200)
  </script>
</body>
</html>
